[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsunagu"
version = "0.1.0"
description = "GraphRAG vs vector RAG on cross-referenced technical documentation"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "llama-index-core>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
tsunagu = "tsunagu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not slow'"
markers = ["slow: needs model downloads or network beyond tiktoken"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
