llm:
  provider: nvidia
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  api_key_env: NVIDIA_API_KEY
  temperature: 0.0
  max_tokens: 2048
  rpm: 35
  timeout_s: 120
  max_retries: 5
  disable_thinking: true

chunking:
  target_tokens: 500
  overlap_tokens: 50
  max_tokens: 900

retrieval:
  top_k: 8
  candidate_k: 20
  rrf_k: 60
  embed_model: BAAI/bge-small-en-v1.5

graph:
  extraction_backend: json   # set by Task 16 spike (llamaindex dropped due to relation schema mismatch)
  max_triplets_per_chunk: 10
  merge_threshold: 0.92
  hops: 2
  seed_vector_k: 5
  seed_min_sim: 0.6
  max_expand_degree: 40
  # Revision 2 (2026-10-22, after the first retrieval run): v1 reached 630 to 732 of 732
  # chunks and returned dense's top 8 on 29/30 questions. Values chosen from corpus
  # statistics before re-running; see design doc fact 6. Null / 0.0 / false = v1.
  hub_chunk_frac: 0.02          # entity in more than 2% of chunks (14) = hub
  hop_penalty: 0.05             # similarity cost per hop from the seeds
  code_only_single_words: true  # a plain one-word match only seeds code entities

evaluation:
  repeats: 3
  systems: [dense, hybrid, graph]
